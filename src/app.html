<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Doomscroll" />
		<meta name="description" content="Read any EPUB as a Twitter timeline." />
		<script>
			// Apply the saved background before the app loads so Light and Dim users don't see a black flash.
			try {
				const theme = JSON.parse(localStorage.getItem('settings') || '{}').theme;
				if (theme === 'light' || theme === 'dim') document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
